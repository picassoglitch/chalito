v: 1
id: lm-studio
name: LM Studio
vendor: Element Labs
homepage: https://lmstudio.ai/
termsUrl: https://lmstudio.ai/app-terms
kinds: [desktop-app, terminal]
platforms:
  mac:
    detect:
      commands: [lms]
      paths: ["/Applications/LM Studio.app", "~/.lmstudio/bin/lms"]
      bundleIds: [ai.elementlabs.lmstudio]
      appUserModelIds: []
    install:
      via: brew
      ref: lm-studio
      cask: true
    launch:
      app: LM Studio
  windows:
    detect:
      commands: [lms]
      paths: ["%LOCALAPPDATA%\\Programs\\LM Studio\\LM Studio.exe", "%USERPROFILE%\\.lmstudio\\bin\\lms.exe"]
      bundleIds: []
      appUserModelIds: []
    install:
      via: winget
      ref: ElementLabs.LMStudio
  linux:
    detect:
      commands: [lms]
      paths: ["~/.lmstudio/bin/lms"]
      bundleIds: []
      appUserModelIds: []
    install:
      via: official-url
      ref: https://lmstudio.ai/download
signin:
  via: desktop-app
  url: https://lmstudio.ai/
  planSignin: "on"
driver:
  terminal: { command: [lms, chat] }
  desktopApp: { bundleId: ai.elementlabs.lmstudio, exe: LM Studio.exe }
capabilities: [terminal, remote-view, ai-control]
verification:
  checked: "2026-10-06"
  sources:
    - "https://formulae.brew.sh/api/cask/lm-studio.json (0.4.25,1; 'LM Studio.app'; ids ai.elementlabs.lmstudio)"
    - "github.com/microsoft/winget-pkgs manifests/e/ElementLabs/LMStudio (latest 0.4.25+1, nullsoft, user + machine scope)"
    - "https://lmstudio.ai/docs/cli (lms ships with LM Studio; run the app once first; commands chat, get, load, server, daemon, link, login [beta, for publishing])"
  unverified:
    - field: signin
      note: "LM Studio needs no account to run local models. 'lms login' exists but is for Hub publishing (beta), so signin is just 'open the app'."
    - field: platforms.*.detect.paths
      note: "~/.lmstudio/bin/lms and the Windows install dir are not stated in the docs page fetched."
    - field: driver.acp
      note: "No ACP mode documented for lms."
    - field: platforms.linux
      note: "Linux is an AppImage from lmstudio.ai/download; no fixed app path or desktop file id. lms only exists after the app has run once."
