# Model routing (brief §2). Model ids live only here. See D-012 and VERIFIED_APIS.
# A tier's `maxProfile` (plans.yaml) caps which profile it may use.
schemaVersion: 1

vertex:
  location: global # regional endpoints cost +10% for Gemini 3+, and 3.1 Flash-Lite is global/multi-region only

roles:
  router: { provider: google, model: gemini-3.1-flash-lite, fallback: { provider: openai, model: gpt-6-luna } }
  moderator: { provider: google, model: gemini-3.1-flash-lite, fallback: { provider: openai, model: gpt-6-luna } }
  summarizer: { provider: google, model: gemini-3.1-flash-lite, fallback: { provider: openai, model: gpt-6-luna } }

# Managed brains per efficiency profile. free_min makes no LLM calls (decision #6).
profiles:
  max:
    companion: { provider: anthropic, model: claude-opus-5-5 }
    mesa:
      anthropic: claude-opus-5-5
      openai: gpt-5.6-luna
      xai: grok-4.7
  standard:
    companion: { provider: anthropic, model: claude-sonnet-5-5 }
    mesa:
      anthropic: claude-sonnet-5-5
      openai: gpt-5.6-luna
      xai: grok-4.3
  low:
    companion: { provider: google, model: gemini-3.1-flash-lite }
    mesa:
      anthropic: claude-haiku-4-5
      openai: gpt-6-luna
      xai: grok-4.3
  free_min: {}

voice:
  desktop: { provider: openai, model: gpt-realtime-2.1-mini }
  call: { provider: openai, model: gpt-realtime-2.1-mini }

# Image generation: custom companions from a photo (apps/avatar-jobs), in the roster's art style.
images:
  avatar: { provider: google, model: gemini-3.1-flash-image }
