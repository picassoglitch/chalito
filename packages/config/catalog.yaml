# Cosmetics (pay-to-dress, never pay-to-win: nothing here can change what a companion can do).
# Prices only here, in billable hub tokens, paid from the hub balance (D-030). The paid prices are
# placeholders for the owner to confirm (decision #16), on the owner's scale: a single clothing item
# ≈ 200 tokens, a full outfit ≈ 5,000 tokens. Art lives in @chalito/roster (cosmetics/),
# generated with Google AI Studio and logged in docs/ASSET_PROVENANCE.md.
#
# card: placement on a 2.5D image card (width as a fraction of the card; pivot is the point of the
# item image that lands on the slot's anchor). vrm: offset from the slot's humanoid bone, metres.
schemaVersion: 1
cosmetics:
  viking_hat:
    name: { es: Casco vikingo, en: Viking helmet }
    slot: head
    free: true
    art: cosmetics/viking_hat.webp
    card: { width: 0.5, pivot: [0.5, 0.95] }
    vrm: { offset: [0, 0.14, 0] }
