name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  agent-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chalito/agent build src/smoke.ts
      # No Secret Service on the runner: exit 2 (keychain unavailable) is fine, but the addon must load.
      - name: Run the smoke binary
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/apps/agent/dist/chalito-agent-x86_64-unknown-linux-gnu" ./chalito-agent
          set +e; ./chalito-agent > smoke.json; code=$?; set -e
          cat smoke.json
          [ "$code" = 0 ] || [ "$code" = 2 ]
          grep -q '"addonLoaded":true' smoke.json
          grep -q '"sodium":true' smoke.json
      - run: pnpm --filter @chalito/agent exec vitest run test/binary-smoke.test.ts

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      # Postgres, PostgREST, GoTrue and Realtime are enough for the migrations, RLS and smoke tests.
      - run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,storage-api
      - run: supabase test db
      - run: supabase/scripts/smoke-data-api.sh
      # ApiRepo (PostgresRepo) and IdentityIssuer (SupabaseIssuer) contracts against the local stack's
      # database and Auth, then the agent's SupabaseStore (apps/agent/test/*.int.test.ts).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Point the contract tests at the local stack
        run: |
          supabase status -o json > "$RUNNER_TEMP/sb.json"
          {
            echo "DATABASE_URL=$(jq -r '.DB_URL' "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_AUTH_URL=$(jq -r '.API_URL' "$RUNNER_TEMP/sb.json")/auth/v1"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' "$RUNNER_TEMP/sb.json")"
            echo "SUPABASE_ANON_KEY=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' "$RUNNER_TEMP/sb.json")"
          } >> "$GITHUB_ENV"
      - run: pnpm --filter @chalito/api test:pg
        env:
          # The api's least-privilege role (security review S2); postgres holds it with SET.
          CHALITO_DB_ROLE: chalito_server
      - name: Agent SupabaseStore and browser client integration
        run: |
          eval "$(supabase status -o env)"
          export API_URL ANON_KEY SERVICE_ROLE_KEY
          export PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-}"
          pnpm --filter @chalito/agent test:supabase
          pnpm --filter @chalito/client test:supabase
      # Realtime delivery (supabase-js against the local stack).
      - run: npm install --no-save --no-package-lock --prefix supabase/scripts @supabase/supabase-js@2.117.2 postgres@3.4.9
      - run: node supabase/scripts/realtime-latency.mjs
      - if: always()
        run: supabase stop --no-backup

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
        working-directory: infra/terraform/envs/dev
      - run: terraform validate
        working-directory: infra/terraform/envs/dev
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$PWD/.tflint.hcl"
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          # `terraform plan` via Workload Identity Federation is added once the owner
          # creates the WIF pool for this repo (OPS); until then CI runs without credentials.
