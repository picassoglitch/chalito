[package]
name = "chalito-desktop"
version = "0.0.0"
description = "Chalito desktop companion (pet, panel, room)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "chalito_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.6"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
# First Run C: start with the computer (on by default; a switch in the panel and the tray).
tauri-plugin-autostart = "2"
# First Run C: the OS folder picker for workspaces (Rust side only; no JS permission).
tauri-plugin-dialog = "2"
# The tray item's language: the OS locale, like the panel's navigator.language (LANG is unset on macOS/Windows).
sys-locale = "0.3"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
# Default features minus `zip`: every zip 4.x release (the updater's requirement) is yanked.
# `zip` only adds installing v1-style .zip (Windows) / .tar.gz AppImage (Linux) payloads; our
# release sets createUpdaterArtifacts: true, which ships the raw installers, so nothing changes.
# macOS .app.tar.gz extraction does not depend on it.
# `~2.13`: the tauri CLI fails the build unless this matches @tauri-apps/plugin-updater (2.13.x).
tauri-plugin-updater = { version = "~2.13", default-features = false, features = ["rustls-tls", "system-proxy"] }
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The pet's input region (apply_input_region). Already in the build through tauri's Linux webview.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Other copies (copies_windows.rs): reads the uninstall entries, Run value and chalito:// handler.
# Already in the build through tauri-plugin-autostart and tauri-plugin-deep-link.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
