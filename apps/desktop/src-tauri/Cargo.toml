[package]
name = "chalito-desktop"
version = "0.0.0"
description = "Chalito desktop companion (pet, panel, room)"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "chalito_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-deep-link = "2.6"
tauri-plugin-opener = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
